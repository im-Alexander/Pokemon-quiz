<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Quiz</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" type="image/x-icon" href="./assets/images/pokeball_PNG22-3138372768.png">

    <!-- Imported Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Check if user tries to leave the page-->
    <script language="JavaScript">
        window.onbeforeunload = confirmExit;
        function confirmExit() {
            return "WARNING: You are attempting to leave this page! If you do your progress will be lost!";
        }
    </script>

    <div class="container">
        <h1 class="title">Pokémon Quiz</h1>

        <h2 class="questionNumber">
            Click the button below to start the quiz!
        </h2>
        <div class="radioField invisible">
            <div class="optionRow">
                <div class="option">
                    <label for="A">A</label>
                    <input type="radio" name="answer" value="A" id="a">
                </div>

                <div class="option">
                    <label for="B">B</label>
                    <input type="radio" name="answer" value="B" id="b">
                </div>
            </div>

            <div class="optionRow">
                <div class="option">
                    <label for="C">C</label>
                    <input type="radio" name="answer" value="C" id="c">
                </div>

                <div class="option">
                    <label for="D">D</label>
                    <input type="radio" name="answer" value="D" id="d">
                </div>

            </div>

        </div>

        <!-- Bonus question box starts invisible-->
        <input type="number" name="bonusAnswer" class="bonusAnswer invisible" value="0">

        <!-- Bonus question box starts invisible-->
        <input type="text" name="password" class="password invisible">

        <br>
        <input type="submit" value="Start Quiz!" class="submitButton">
    </div>


    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="./index.js"></script>
</body>

</html>
